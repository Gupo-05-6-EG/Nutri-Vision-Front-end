name: CI

on:
  push:
    branches: [main, develop]
  # Sem filtro de branch: PRs empilhados (base numa feature branch) tambem
  # precisam de CI, e com o filtro eles ficavam sem nenhum check.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.7"

jobs:
  analyze:
    name: Formatacao e analise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: .env a partir do exemplo
        run: cp .env.example .env
      - run: flutter pub get
      - name: dart format
        run: dart format --output=none --set-exit-if-changed .
      - name: flutter analyze
        run: flutter analyze

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cp .env.example .env
      - run: flutter pub get
      - name: flutter test
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-app
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-apk:
    name: Build do APK (debug)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cp .env.example .env
      # As pastas android/ e ios/ sao geradas e nao versionadas (ver .gitignore).
      - name: Gera as pastas de plataforma
        run: flutter create --platforms=android,ios --org br.com.nutrivision .
      - run: flutter pub get
      - name: flutter build apk --debug
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: nutri-vision-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
