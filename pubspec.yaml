name: nutri_vision
description: App do paciente do Nutri Vision - registro de refeicoes por foto.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  hive: ^2.2.3
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  # Foto da refeicao para a analise da IA (camera ou galeria).
  image_picker: ^1.2.4
  # Fixo: a partir da 0.8.13+18 o plugin exige Flutter >= 3.44, e o CI usa 3.41.7.
  image_picker_android: 0.8.13+17
  # MediaType do arquivo no upload multipart da foto.
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # O .env nao vai pro git (ver .gitignore). Rode `cp .env.example .env`
    # antes do primeiro build - o CI faz isso automaticamente.
    - .env
    # Ilustracoes do prototipo.
    - assets/images/
  # Nunito (SIL Open Font License, ver assets/fonts/OFL.txt): embutida para
  # funcionar sem internet e igual em todas as plataformas.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
