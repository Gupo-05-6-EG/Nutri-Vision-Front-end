name: nutri_vision
description: App do paciente do Nutri Vision - registro de refeicoes por foto.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # O .env nao vai pro git (ver .gitignore). Rode `cp .env.example .env`
    # antes do primeiro build - o CI faz isso automaticamente.
    - .env
